name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      # The generated index is part of the repository, so a change that leaves it stale fails here
      # rather than shipping a map that no longer matches the territory.
      - run: npm run index -- --check
  # Rebuild the site when the content changes on main.
  # Needs the SITE_DISPATCH_TOKEN secret: a PAT with repo scope on the site repository.
  dispatch-site:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger site rebuild
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "SITE_DISPATCH_TOKEN is not set, skipping"; exit 0; fi
          curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/fernandodenitto/lakenaut/dispatches \
            -d '{"event_type":"content-updated"}'
