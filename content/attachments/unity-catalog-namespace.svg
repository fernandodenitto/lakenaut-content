<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 376" width="900" height="376" role="img" aria-labelledby="ttl">
  <title id="ttl">The Unity Catalog three-level namespace and its securables</title>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8f9a"/>
    </marker>
    <marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2662a"/>
    </marker>
  </defs>
  <style>
    .box { fill:#8a8f9a; fill-opacity:.06; stroke:#8a8f9a; stroke-width:1.4 }
    .box-a { fill:#e2662a; fill-opacity:.10; stroke:#e2662a; stroke-width:1.6 }
    .zone { fill:none; stroke:#8a8f9a; stroke-width:1.2; stroke-dasharray:5 4; opacity:.75 }
    .t  { font:600 13px ui-sans-serif,system-ui,-apple-system,sans-serif; fill:#8f959f }
    .ta { font:600 13px ui-sans-serif,system-ui,-apple-system,sans-serif; fill:#e2662a }
    .s  { font:400 11px ui-sans-serif,system-ui,-apple-system,sans-serif; fill:#82888f }
    .lbl{ font:600 10px ui-sans-serif,system-ui,-apple-system,sans-serif; fill:#82888f; letter-spacing:.08em }
    .m  { font:500 10.5px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#82888f }
    .ma { font:500 10.5px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#e2662a }
    .ar { fill:none; stroke:#8a8f9a; stroke-width:1.4; marker-end:url(#h) }
    .ar-a { fill:none; stroke:#e2662a; stroke-width:1.6; marker-end:url(#ha) }
    .ln { stroke:#8a8f9a; stroke-width:1.2; opacity:.6 }
  </style>
  <text x="20" y="30" class="lbl" text-anchor="start">THREE-LEVEL NAMESPACE</text>
  <rect x="20" y="44" width="200" height="54" rx="9" class="box"/>
  <text x="34" y="68" class="t" text-anchor="start">Metastore</text>
  <text x="34" y="86" class="s" text-anchor="start">one per region</text>
  <path d="M220 71 L258 71" class="ar"/>
  <rect x="258" y="44" width="200" height="54" rx="9" class="box"/>
  <text x="272" y="68" class="t" text-anchor="start">Catalog</text>
  <text x="272" y="86" class="s" text-anchor="start">first name part</text>
  <path d="M458 71 L496 71" class="ar"/>
  <rect x="496" y="44" width="200" height="54" rx="9" class="box"/>
  <text x="510" y="68" class="t" text-anchor="start">Schema</text>
  <text x="510" y="86" class="s" text-anchor="start">second name part</text>
  <path d="M696 71 L734 71" class="ar"/>
  <rect x="734" y="44" width="146" height="54" rx="9" class="box-a"/>
  <text x="748" y="68" class="ta" text-anchor="start">Securable</text>
  <text x="748" y="86" class="s" text-anchor="start">third name part</text>
  <text x="20" y="132" class="ma" text-anchor="start">main.sales.orders</text>
  <text x="160" y="132" class="m" text-anchor="start">&#8592; catalog . schema . table</text>
  <text x="20" y="176" class="lbl" text-anchor="start">SECURABLES IN A SCHEMA</text>
  <rect x="20" y="190" width="155" height="56" rx="9" class="box"/>
  <text x="34" y="214" class="t" text-anchor="start">Table</text>
  <text x="34" y="232" class="s" text-anchor="start">managed or external</text>
  <rect x="193" y="190" width="155" height="56" rx="9" class="box"/>
  <text x="207" y="214" class="t" text-anchor="start">View</text>
  <text x="207" y="232" class="s" text-anchor="start">saved query</text>
  <rect x="366" y="190" width="155" height="56" rx="9" class="box"/>
  <text x="380" y="214" class="t" text-anchor="start">Volume</text>
  <text x="380" y="232" class="s" text-anchor="start">files, not rows</text>
  <rect x="539" y="190" width="155" height="56" rx="9" class="box"/>
  <text x="553" y="214" class="t" text-anchor="start">Function</text>
  <text x="553" y="232" class="s" text-anchor="start">SQL or Python UDF</text>
  <rect x="712" y="190" width="155" height="56" rx="9" class="box"/>
  <text x="726" y="214" class="t" text-anchor="start">Model</text>
  <text x="726" y="232" class="s" text-anchor="start">versions and aliases</text>
  <text x="20" y="288" class="lbl" text-anchor="start">ACCESS TO CLOUD STORAGE</text>
  <rect x="20" y="302" width="250" height="54" rx="9" class="box"/>
  <text x="34" y="326" class="t" text-anchor="start">Storage credential</text>
  <text x="34" y="344" class="s" text-anchor="start">the IAM role or identity</text>
  <path d="M270 329 L308 329" class="ar"/>
  <rect x="308" y="302" width="250" height="54" rx="9" class="box"/>
  <text x="322" y="326" class="t" text-anchor="start">External location</text>
  <text x="322" y="344" class="s" text-anchor="start">credential plus a path</text>
  <path d="M558 329 L596 329" class="ar"/>
  <rect x="596" y="302" width="284" height="54" rx="9" class="box"/>
  <text x="610" y="326" class="t" text-anchor="start">External tables and volumes</text>
  <text x="610" y="344" class="s" text-anchor="start">data stays where it already is</text>
</svg>
